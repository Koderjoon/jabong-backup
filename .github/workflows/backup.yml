name: 매일 백업

# 매일 새벽 3시 7분(한국 시간)에 자봉 장부 전체를 backups/ 에 올린다.
# 서버에 접속하므로 Supabase가 잠들지 않게 하는 효과도 있다.
on:
  schedule:
    - cron: '7 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 백업 받기
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node backup.mjs
      - name: 저장소에 올리기
        run: |
          git config user.name "jabong-backup"
          git config user.email "actions@users.noreply.github.com"
          git add backups
          git commit -m "백업 $(TZ=Asia/Seoul date +%F)" || echo "바뀐 내용 없음"
          git push
